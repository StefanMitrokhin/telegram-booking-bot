[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-booking-bot"
version = "0.1.0"
description = "Telegram-бот записи клиентов на услуги"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stephanchik" }]
dependencies = [
  "aiogram>=3.34,<4",
  "sqlalchemy[asyncio]>=2.0.36,<2.2",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.11,<3",
  "apscheduler>=3.11,<4",
  "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9",
]

[project.scripts]
booking-bot = "booking_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "alembic"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001", "UP035", "UP007"]
"src/booking_bot/services/parsing.py" = ["RUF001"]
"src/booking_bot/texts.py" = ["RUF001"]
"src/booking_bot/bot/texts.py" = ["RUF001", "E501"]
"src/booking_bot/bot/keyboards.py" = ["RUF001", "E501"]
"src/booking_bot/bot/commands.py" = ["RUF001", "RUF005"]
"src/booking_bot/services/timeutils.py" = ["RUF001"]
"src/booking_bot/services/export.py" = ["RUF001"]
"tests/**/*.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"